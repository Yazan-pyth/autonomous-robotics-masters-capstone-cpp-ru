name: Starter infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build C++ and run unit tests in image
        run: docker compose build
      - name: Verify clock across two containers
        run: timeout 90s docker compose up --abort-on-container-exit --exit-code-from autonomy
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
